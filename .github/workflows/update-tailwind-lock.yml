name: Update Tailwind dependency lockfile

on:
  push:
    branches: [feat/tailwind-calm-ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tailwind-calm-ui
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve new Tailwind dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: lock Tailwind CSS dependencies"
            git push origin HEAD:feat/tailwind-calm-ui
          fi
